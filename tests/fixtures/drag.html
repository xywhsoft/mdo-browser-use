<!doctype html><meta charset="utf-8"><title>Browser Use drag fixture</title>
<style>body{margin:30px;font:16px sans-serif}#board{display:flex;gap:70px;align-items:center;margin-top:30px}#pointer,#html,#drop{padding:25px;background:#ddd;user-select:none}#drop{width:160px;height:90px;border:2px dashed #555}output{display:block;margin:20px}</style>
<h1>Native drag fixture</h1><div id="board"><div id="pointer" role="button" aria-label="Pointer handle">Pointer</div><div id="html" draggable="true" role="button" aria-label="HTML handle">HTML</div><div id="drop" role="button" aria-label="Drop target">Drop here</div></div><output id="pointer-result"></output><output id="drop-result"></output>
<script>
let start=0,trusted=true;
const pointer=document.querySelector('#pointer');
pointer.addEventListener('pointerdown',event=>{event.preventDefault();start=event.clientX;trusted=event.isTrusted;document.body.dataset.held='true';pointer.setPointerCapture(event.pointerId);if(document.body.dataset.blockPointer==='true'){const until=performance.now()+1000;while(performance.now()<until){}}});
pointer.addEventListener('pointermove',event=>{if(document.body.dataset.held==='true'){trusted&&=event.isTrusted;document.body.dataset.dx=String(Math.round(event.clientX-start))}});
for(const type of ['pointerup','pointercancel'])pointer.addEventListener(type,event=>{document.body.dataset.held='false';document.querySelector('#pointer-result').textContent='Pointer release '+event.isTrusted+' '+document.body.dataset.dx;trusted&&=event.isTrusted;document.body.dataset.pointerTrusted=String(trusted)});
document.querySelector('#html').addEventListener('dragstart',event=>{event.dataTransfer.effectAllowed='copyMove';event.dataTransfer.setData('text/plain',document.body.dataset.large==='true'?'x'.repeat(20000):'browser-use-drag');document.body.dataset.dragStart=String(event.isTrusted)});
const drop=document.querySelector('#drop');
drop.addEventListener('dragover',event=>{event.preventDefault();event.dataTransfer.dropEffect='move'});
drop.addEventListener('drop',event=>{event.preventDefault();document.body.dataset.drops=String(Number(document.body.dataset.drops||0)+1);document.body.dataset.dropTrusted=String(event.isTrusted);document.querySelector('#drop-result').textContent=event.dataTransfer.getData('text/plain')==='browser-use-drag'?'HTML drop verified':'Wrong drop data'});
</script>
