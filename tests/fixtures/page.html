<!doctype html>
<meta charset="utf-8">
<title>Browser Use page fixture</title>
<style>body{font:16px sans-serif;margin:24px}label,button,input{margin:6px}iframe{height:80px;width:400px}</style>
<h1>Browser Use fixture</h1>
<label for="order">订单号</label><input id="order" value="initial" data-testid="order-field" placeholder="Order number">
<label for="password">Password</label><input id="password" type="password" value="fixture-private-value">
<button id="search" aria-label="查询">Run query</button>
<button>Duplicate</button><button>Duplicate</button>
<input id="agree" type="checkbox"><label for="agree">Agree</label>
<div hidden><button>Hidden action</button><span>Hidden content</span></div>
<div id="shadow"></div>
<iframe title="same origin" srcdoc="<label for='inner'>Frame input</label><input id='inner'><button>Frame action</button>"></iframe>
<iframe title="opaque" src="data:text/html,%3Cbutton%3EOpaque%20action%3C/button%3E"></iframe>
<p>Readable fixture text. 中文和 Emoji 🦉 remain intact.</p>
<output id="events"></output>
<button disabled id="disabled">Disabled action</button><input readonly aria-label="Read only">
<button id="dialog-alert">Alert dialog</button><button id="dialog-confirm">Confirm dialog</button><button id="dialog-prompt">Prompt dialog</button>
<output id="dialog-result"></output>
<button id="popup-open">Open popup</button><output id="popup-result"></output>
<button id="popup-blank">Open blank popup</button>
<button id="mouse-gestures">Mouse gestures</button><output id="mouse-result"></output>
<label for="shipping">Delivery method</label><select id="shipping"><option value="standard">Standard</option><option value="disabled" disabled>Unavailable</option><optgroup label="Paused" disabled><option value="group-disabled">Paused delivery</option></optgroup><option value="express">Express</option><option value="overnight">Overnight</option></select>
<label for="colors">Colors</label><select id="colors" multiple size="4"><option value="red">Red</option><option disabled value="disabled">Unavailable</option><option value="green">Green</option><option value="blue">Blue</option></select><output id="selection-result"></output><output id="selection-counts"></output>
<script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button>Shadow action</button>';</script>
<script>
document.querySelector('#search').addEventListener('click',e=>{document.body.dataset.clicked=e.isTrusted?'trusted':'untrusted';document.body.dataset.clicks=String(Number(document.body.dataset.clicks||0)+1);document.querySelector('#events').textContent=(e.isTrusted?'Trusted click ':'Untrusted click ')+document.body.dataset.clicks});
document.querySelector('#order').addEventListener('input',e=>{document.body.dataset.input=e.isTrusted?'trusted':'untrusted'});
document.querySelector('#dialog-alert').onclick=()=>{alert('Fixture alert');document.querySelector('#dialog-result').textContent='alert:closed'};
document.querySelector('#dialog-confirm').onclick=()=>{document.querySelector('#dialog-result').textContent='confirm:'+confirm('Fixture confirm')};
document.querySelector('#dialog-prompt').onclick=()=>{document.querySelector('#dialog-result').textContent='prompt:'+prompt('Fixture prompt','fixture-private-default')};
document.querySelector('#popup-open').onclick=()=>{window.open('/__browser_use_popup__.html','browser-use-child')};
document.querySelector('#popup-blank').onclick=()=>{const child=window.open('about:blank','browser-use-blank');if(child){child.document.write(`<h1>Written blank popup</h1><button onclick="document.querySelector('output').textContent='Blank action verified'">Blank action</button><output></output>`);child.document.close()}};
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.fixture==='popup-ready')document.querySelector('#popup-result').textContent='Popup connected'});
for(const type of ['dblclick','contextmenu','auxclick'])document.querySelector('#mouse-gestures').addEventListener(type,event=>{
  event.preventDefault();document.querySelector('#mouse-result').textContent=type+':'+event.button+':'+event.isTrusted;
});
for(const id of ['shipping','colors'])document.querySelector('#'+id).addEventListener('change',event=>{
  document.querySelector('#selection-result').textContent=id+':'+event.isTrusted;
  document.body.dataset.selectionChanges=String(Number(document.body.dataset.selectionChanges||0)+1);
  document.querySelector('#selection-counts').textContent='Selection events '+document.body.dataset.selectionChanges+'/'+document.body.dataset.selectionInputs;
});
for(const id of ['shipping','colors'])document.querySelector('#'+id).addEventListener('input',()=>{
  document.body.dataset.selectionInputs=String(Number(document.body.dataset.selectionInputs||0)+1);
});
</script>
