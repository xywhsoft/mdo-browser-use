<!doctype html>
<meta charset="utf-8">
<title>Browser Use page fixture</title>
<style>body{font:16px sans-serif;margin:24px}label,button,input{margin:6px}iframe{height:80px;width:400px}</style>
<h1>Browser Use fixture</h1>
<label for="order">订单号</label><input id="order" value="initial">
<label for="password">Password</label><input id="password" type="password" value="fixture-private-value">
<button id="search" aria-label="查询">Run query</button>
<button>Duplicate</button><button>Duplicate</button>
<input id="agree" type="checkbox"><label for="agree">Agree</label>
<div hidden><button>Hidden action</button><span>Hidden content</span></div>
<div id="shadow"></div>
<iframe title="same origin" srcdoc="<label for='inner'>Frame input</label><input id='inner'><button>Frame action</button>"></iframe>
<iframe title="opaque" src="data:text/html,%3Cbutton%3EOpaque%20action%3C/button%3E"></iframe>
<p>Readable fixture text. 中文和 Emoji 🦉 remain intact.</p>
<script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button>Shadow action</button>';</script>
