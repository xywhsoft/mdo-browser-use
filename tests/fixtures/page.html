<!doctype html>
<meta charset="utf-8">
<title>Browser Use page fixture</title>
<style>body{font:16px sans-serif;margin:24px}label,button,input{margin:6px}iframe{height:80px;width:400px}</style>
<h1>Browser Use fixture</h1>
<label for="order">订单号</label><input id="order" value="initial" data-testid="order-field" placeholder="Order number">
<label for="password">Password</label><input id="password" type="password" value="fixture-private-value">
<button id="search" aria-label="查询">Run query</button>
<button>Duplicate</button><button>Duplicate</button>
<input id="agree" type="checkbox"><label for="agree">Agree</label>
<div hidden><button>Hidden action</button><span>Hidden content</span></div>
<div id="shadow"></div>
<iframe title="same origin" srcdoc="<label for='inner'>Frame input</label><input id='inner'><button>Frame action</button>"></iframe>
<iframe title="opaque" src="data:text/html,%3Cbutton%3EOpaque%20action%3C/button%3E"></iframe>
<p>Readable fixture text. 中文和 Emoji 🦉 remain intact.</p>
<output id="events"></output>
<button disabled id="disabled">Disabled action</button><input readonly aria-label="Read only">
<button id="dialog-alert">Alert dialog</button><button id="dialog-confirm">Confirm dialog</button><button id="dialog-prompt">Prompt dialog</button>
<output id="dialog-result"></output>
<script>document.querySelector('#shadow').attachShadow({mode:'open'}).innerHTML='<button>Shadow action</button>';</script>
<script>
document.querySelector('#search').addEventListener('click',e=>{document.body.dataset.clicked=e.isTrusted?'trusted':'untrusted';document.body.dataset.clicks=String(Number(document.body.dataset.clicks||0)+1);document.querySelector('#events').textContent=(e.isTrusted?'Trusted click ':'Untrusted click ')+document.body.dataset.clicks});
document.querySelector('#order').addEventListener('input',e=>{document.body.dataset.input=e.isTrusted?'trusted':'untrusted'});
document.querySelector('#dialog-alert').onclick=()=>{alert('Fixture alert');document.querySelector('#dialog-result').textContent='alert:closed'};
document.querySelector('#dialog-confirm').onclick=()=>{document.querySelector('#dialog-result').textContent='confirm:'+confirm('Fixture confirm')};
document.querySelector('#dialog-prompt').onclick=()=>{document.querySelector('#dialog-result').textContent='prompt:'+prompt('Fixture prompt','fixture-private-default')};
</script>
